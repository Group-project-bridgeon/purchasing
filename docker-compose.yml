services:
  postgres:
    image: postgres:16
    container_name: purchasing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: purchasing
    ports:
      - "5433:5432"
    volumes:
      - purchasing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d purchasing"]
      interval: 5s
      timeout: 5s
      retries: 5

  purchasing-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purchasing-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/purchasing?sslmode=disable
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  purchasing_pgdata:
