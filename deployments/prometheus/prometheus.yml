global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "purchasing-service"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["purchasing-service:8080"]
        labels:
          app: "purchasing-microservice"
          env: "docker-compose"

  - job_name: "prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]
