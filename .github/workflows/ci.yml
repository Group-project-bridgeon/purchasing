name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'feature/**' ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'
  GOTOOLCHAIN: local

jobs:
  # ============================================================================
  # 1. Code Quality, Formatting & Static Analysis
  # ============================================================================
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Formatting (go fmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Verify Routes Configuration
        run: |
          test -f config/routes.yaml || exit 1
          test -f internal/config/routes.yaml || exit 1

  # ============================================================================
  # 2. Automated Test Suite (Unit & Integration Tests)
  # ============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: purchasing
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d purchasing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Unit Tests with Coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/service/... ./internal/config/... ./internal/middleware/... ./internal/api/... ./internal/docs/...

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/purchasing?sslmode=disable
        run: |
          go test -v -count=1 ./internal/repository/... ./internal/database/...

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  # ============================================================================
  # 3. Multi-Stage Docker Container Build
  # ============================================================================
  docker:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: purchasing-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
